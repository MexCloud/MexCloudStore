<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* =========================
   GLOBAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background: radial-gradient(circle at top, #1a0b2e, #0a0612);
    overflow-x:hidden;
    color:white;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:999;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 20px;
    background:rgba(124,58,237,.75);
    backdrop-filter:blur(15px);
    color:white;
}

.search{
    flex:1;
    margin:0 15px;
}

.search input{
    width:100%;
    padding:10px 12px;
    border:none;
    border-radius:25px;
    outline:none;
}

/* =========================
   HERO
========================= */

.hero{
    text-align:center;
    padding:100px 20px 70px;
    position:relative;
    overflow:hidden;
}

/* CLOUDS */
.clouds{
    position:absolute;
    top:0;
    left:0;
    width:200%;
    height:100%;
    background:url("https://i.ibb.co/2n3Z6hR/cloud.png");
    opacity:0.07;
    animation:moveCloud 60s linear infinite;
    z-index:0;
}

@keyframes moveCloud{
    from{transform:translateX(0);}
    to{transform:translateX(-50%);}
}

/* FIRE */
.fire{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:500px;
    height:500px;
    background:radial-gradient(circle, rgba(255,80,0,0.5), transparent 65%);
    filter:blur(35px);
    animation:fireAnim 2s infinite alternate;
    z-index:0;
}

@keyframes fireAnim{
    from{transform:translate(-50%,-50%) scale(1);}
    to{transform:translate(-50%,-50%) scale(1.15);}
}

/* CONTENT */
.hero *{
    position:relative;
    z-index:2;
}

.logo-big{
    width:240px;
    animation:float 5s ease-in-out infinite;
    filter:drop-shadow(0 0 25px rgba(255,165,0,.5));
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

.title{
    font-size:34px;
    font-weight:700;
    margin-top:10px;
    letter-spacing:2px;
}

.subtitle{
    letter-spacing:3px;
    opacity:0.7;
    margin-top:5px;
}

/* =========================
   PRODUCTS
========================= */

.product-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    padding:15px;
    border-radius:12px;
    text-align:center;
    backdrop-filter:blur(10px);
    transition:.2s;
}

.card:hover{
    transform:translateY(-5px);
}

.price{
    color:#c084fc;
    font-weight:700;
    margin:5px 0;
}

button{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    background:#7c3aed;
    color:white;
    cursor:pointer;
}

/* =========================
   CART
========================= */

#cart{
    position:fixed;
    right:-400px;
    top:0;
    width:350px;
    height:100%;
    background:white;
    color:black;
    transition:.3s;
    padding:15px;
    box-shadow:-10px 0 20px rgba(0,0,0,.3);
    z-index:9999;
}

#cart.open{right:0}

/* =========================
   ADMIN PANEL
========================= */

#admin{
    position:fixed;
    right:0;
    bottom:0;
    width:300px;
    background:#111;
    color:white;
    padding:15px;
    z-index:9999;
}

#admin input{
    width:100%;
    margin:5px 0;
    padding:8px;
}

#admin button{
    width:100%;
    padding:8px;
    background:#7c3aed;
    color:white;
    border:none;
}

/* TOAST */
#toast{
    position:fixed;
    top:80px;
    right:20px;
    background:#22c55e;
    color:white;
    padding:10px;
    display:none;
    border-radius:8px;
}

</style>
</head>

<body>

<header>
<div class="logo">🐉 MexCloud Store</div>

<div class="search">
<input id="search" onkeyup="render()" placeholder="Cari produk...">
</div>

<div onclick="toggleCart()">🛒 Cart</div>
</header>

<!-- HERO -->
<div class="hero">
<div class="clouds"></div>
<div class="fire"></div>

<img src="logo.png" class="logo-big">
<h1 class="title">MexCloud Store</h1>
<p class="subtitle">Breath The Vibe</p>
</div>

<!-- PRODUCTS -->
<div class="product-grid" id="list"></div>

<div id="toast">Ditambahkan</div>

<!-- CART -->
<div id="cart">
<h3>Cart</h3>
<div id="items"></div>
<h3>Total: $<span id="total">0</span></h3>
</div>

<!-- ADMIN -->
<div id="admin">
<h3>Admin Panel</h3>
<input id="pname" placeholder="Nama Produk">
<input id="pprice" placeholder="Harga">
<button onclick="addProduct()">Tambah Produk</button>
</div>

<script>

let cart=[];

let products = JSON.parse(localStorage.getItem("products")) || [
    {name:"iPhone 15 Pro",price:900},
    {name:"Samsung S25 Ultra",price:950},
    {name:"OXVA Pod",price:35}
];

function save(){
localStorage.setItem("products",JSON.stringify(products));
}

function render(){

let list=document.getElementById("list");
let search=document.getElementById("search").value?.toLowerCase()||"";

list.innerHTML="";

products
.filter(p=>p.name.toLowerCase().includes(search))
.forEach((p,i)=>{
list.innerHTML+=`
<div class="card">
<h3>${p.name}</h3>
<div class="price">$${p.price}</div>
<button onclick="add('${p.name}',${p.price})">Tambah</button>
</div>`;
});

save();
}

function add(n,p){
cart.push({n,p});
update();
toast();
}

function update(){

let items=document.getElementById("items");
let total=0;

items.innerHTML="";

cart.forEach((c)=>{
total+=c.p;
items.innerHTML+=`
<div>${c.n} - $${c.p}</div>`;
});

document.getElementById("total").innerText=total;
}

function toast(){
let t=document.getElementById("toast");
t.style.display="block";
setTimeout(()=>t.style.display="none",1200);
}

function toggleCart(){
document.getElementById("cart").classList.toggle("open");
}

function addProduct(){
let n=document.getElementById("pname").value;
let p=parseInt(document.getElementById("pprice").value);

if(!n||!p)return;

products.push({name:n,price:p});
render();

document.getElementById("pname").value="";
document.getElementById("pprice").value="";
}

render();

</script>

</body>
</html>
