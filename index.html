<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0;
  width: 100%;
  height: 60px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  z-index: 999;
}

.logo {
  font-weight: bold;
}

.search-top {
  flex: 1;
  display: flex;
  justify-content: center;
}

.search-top input {
  width: 60%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}

.cart {
  font-size: 20px;
}

#cart-count {
  background: red;
  color: white;
  padding: 3px 7px;
  border-radius: 50%;
  font-size: 12px;
}

/* HERO */
.hero {
  margin-top: 60px;
  position: relative;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* CLOUD */
.cloud {
  position: absolute;
  width: 250px;
  opacity: 0.9;
  animation: moveClouds 60s linear infinite;
}

.cloud1 { top: 80px; left: -300px; }
.cloud2 { top: 200px; left: -400px; animation-duration: 80s; }
.cloud3 { top: 350px; left: -250px; animation-duration: 70s; }

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}

/* DRAGON */
.dragon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 370px;
  z-index: 10;
  animation: floatDragon 4s ease-in-out infinite;
}

@keyframes floatDragon {
  0% { transform: translate(-50%, -50%) translateY(0px); }
  50% { transform: translate(-50%, -50%) translateY(-12px); }
  100% { transform: translate(-50%, -50%) translateY(0px); }
}

/* BRAND */
.brand {
  position: absolute;
  top: 10%;
  width: 100%;
  text-align: center;
}

.title {
  font-size: 52px;
  margin: 0;
  color: black;
  font-weight: 800;
}

.subtitle {
  font-size: 18px;
  margin-top: 10px;
  letter-spacing: 6px;
  color: black;
}

/* KATALOG */
.catalog {
  padding: 30px;
}

.category {
  background: black;
  color: white;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.sub {
  display: none;
  padding-left: 15px;
}

.sub div {
  padding: 8px;
  cursor: pointer;
}

/* PRODUK */
.products {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card button {
  margin-top: 10px;
  padding: 8px;
  border: none;
  background: black;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">MexCloud</div>

  <div class="search-top">
    <input type="text" placeholder="Cari produk...">
  </div>

  <div class="cart">
    🛒 <span id="cart-count">0</span>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <img class="cloud cloud1" src="./cloud.png?v=1">
  <img class="cloud cloud2" src="./cloud.png?v=1">
  <img class="cloud cloud3" src="./cloud.png?v=1">

  <div class="brand">
    <h1 class="title">MexCloud Store</h1>
    <h2 class="subtitle">BREATH THE VIBES</h2>
  </div>

  <img class="dragon" src="./dragon.png?v=1">
</div>

<!-- KATALOG -->
<div class="catalog">

  <div class="category" onclick="toggle('obat')">OBAT INDONESIA</div>
  <div class="sub" id="obat">
    <div onclick="showProducts('obat-umum')">Obat Umum</div>
    <div onclick="showProducts('obat-18')">Obat 18+</div>
  </div>

  <div class="category" onclick="showProducts('rokok')">ROKOK INDONESIA</div>

  <div class="category" onclick="toggle('pod')">POD</div>
  <div class="sub" id="pod">
    <div onclick="showProducts('device')">Device</div>
    <div onclick="toggle('liquid')">Liquid</div>
    <div id="liquid" class="sub">
      <div onclick="showProducts('creamy')">Saltnic Creamy</div>
      <div onclick="showProducts('fruity')">Saltnic Fruity</div>
      <div onclick="showProducts('freebase')">Freebase</div>
    </div>
    <div onclick="showProducts('cartridge')">Cartridge</div>
  </div>

  <div class="category" onclick="toggle('gadget')">GADGET SECOND</div>
  <div class="sub" id="gadget">
    <div onclick="showProducts('iphone')">iPhone</div>
    <div onclick="showProducts('samsung')">Samsung</div>
  </div>

  <div class="category" onclick="toggle('parfum')">PARFUM</div>
  <div class="sub" id="parfum">
    <div onclick="showProducts('wanita')">Wanita</div>
    <div onclick="showProducts('pria')">Pria</div>
    <div onclick="showProducts('unisex')">Unisex</div>
  </div>

</div>

<!-- PRODUK -->
<div class="products" id="products"></div>

<script>
let cart = [];

function addToCart(product) {
  cart.push(product);
  document.getElementById("cart-count").innerText = cart.length;
}

function toggle(id) {
  let el = document.getElementById(id);
  el.style.display = (el.style.display === "block") ? "none" : "block";
}

function showProducts(type) {
  let container = document.getElementById("products");

  let data = {
    "obat-umum": ["Paracetamol", "Bodrex"],
    "obat-18": ["Obat Kuat A", "Obat Kuat B"],
    "rokok": ["Gudang Garam", "Marlboro"],
    "device": ["Caliburn"],
    "creamy": ["Vanilla Custard"],
    "fruity": ["Mango Ice"],
    "freebase": ["Freebase A"],
    "cartridge": ["Cartridge"],
    "iphone": ["iPhone 11"],
    "samsung": ["Samsung S21"],
    "wanita": ["Parfum A"],
    "pria": ["Parfum B"],
    "unisex": ["Parfum C"]
  };

  let items = data[type] || [];

  container.innerHTML = "";

  items.forEach(item => {
    container.innerHTML += `
      <div class="card">
        <h3>${item}</h3>
        <button onclick="addToCart('${item}')">Beli</button>
      </div>
    `;
  });
}
</script>

</body>
</html>
