<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mexcloud Store</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#050505;
  overflow:hidden;
}

/* BACKGROUND */
.hero{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  text-align:center;
  color:white;
}

/* AWAN HALUS */
.cloud{
  position:absolute;
  width:200%;
  height:200%;
  background: url("https://i.ibb.co/2n3Z6hR/cloud.png");
  opacity:0.08;
  animation:moveCloud 60s linear infinite;
}

@keyframes moveCloud{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* API EFFECT HALUS */
.fire{
  position:absolute;
  bottom:-50px;
  width:100%;
  height:300px;
  background: radial-gradient(circle, rgba(255,80,0,0.3), transparent 70%);
  filter: blur(20px);
  animation:fireGlow 3s infinite alternate;
}

@keyframes fireGlow{
  from{opacity:0.4;}
  to{opacity:0.8;}
}

/* CONTENT */
.content{
  position:relative;
  z-index:2;
}

.logo{
  width:260px;
  filter: drop-shadow(0 0 25px rgba(255,255,255,0.25));
  margin-bottom:20px;
}

.title{
  font-size:34px;
  letter-spacing:4px;
  font-weight:700;
}

.subtitle{
  margin-top:10px;
  font-size:14px;
  letter-spacing:3px;
  opacity:0.6;
}
</style>

</head>
<body>

<div class="hero">
  <div class="cloud"></div>
  <div class="fire"></div>

  <div class="content">
    <img src="logo.png" class="logo">
    <div class="title">MEXCLOUD STORE</div>
    <div class="subtitle">BREATH THE VIBE</div>
  </div>
</div>

</body>
</html>
