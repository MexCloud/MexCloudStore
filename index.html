<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at top, #0b0f2a, #050611);
  font-family:Arial, sans-serif;
  color:white;
}

/* ===== CLOUD (PURE CSS, NO IMAGE) ===== */
.clouds::before,
.clouds::after{
  content:"";
  position:absolute;
  width:200%;
  height:300px;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 10%, transparent 60%);
  animation:move 80s linear infinite;
}

.clouds::after{
  top:60px;
  opacity:0.5;
  animation-duration:140s;
}

@keyframes move{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* ===== CENTER ===== */
.center{
  position:absolute;
  top:120px;
  width:100%;
  text-align:center;
  z-index:5;
}

/* ===== DRAGON WRAPPER ===== */
.dragon-wrap{
  position:relative;
  display:inline-block;
}

/* glow */
.glow{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:380px;
  height:380px;
  background:radial-gradient(circle, rgba(255,0,0,0.25), transparent 70%);
  filter:blur(25px);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{transform:translate(-50%,-50%) scale(1); opacity:0.4;}
  50%{transform:translate(-50%,-50%) scale(1.15); opacity:0.8;}
}

/* dragon */
.dragon{
  width:320px;
  filter:drop-shadow(0 0 25px red);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

/* ===== FIRE ===== */
.fire{
  position:absolute;
  left:50%;
  top:160px;
  transform:translateX(-50%);
  width:10px;
  height:10px;
  background:radial-gradient(circle, orange, red, transparent);
  border-radius:50%;
  opacity:0;
  filter:blur(2px);
}

.fire.active{
  animation:blast 1s ease-out;
}

@keyframes blast{
  0%{width:10px;height:10px;opacity:0;}
  30%{opacity:1;}
  100%{width:520px;height:140px;opacity:0;}
}

/* ===== TEXT ===== */
.title{
  font-size:48px;
  font-weight:bold;
  background:linear-gradient(90deg,gold,orange,red);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  font-size:18px;
  opacity:0.8;
  margin-top:8px;
}
</style>
</head>

<body>

<div class="clouds"></div>

<div class="center">

  <div class="dragon-wrap">

    <div class="glow"></div>

    <!-- DRAGON (PURE SVG, NO IMAGE LINK) -->
    <svg class="dragon" viewBox="0 0 512 512">
      <path fill="#ff2b2b" d="M256 35c75 45 115 120 95 190-15 55-70 85-70 130 0 55 75 85 120 135-110-25-160-80-185-140-25 60-75 115-185 140 45-50 120-80 120-135 0-45-55-75-70-130C141 155 181 80 256 35z"/>
    </svg>

    <div class="fire" id="fire"></div>

  </div>

  <div class="title">MexCloud Store</div>
  <div class="sub">Breath The Vibe</div>

</div>

<script>
const fire = document.getElementById("fire");

function breatheFire(){
  fire.classList.add("active");
  setTimeout(()=>fire.classList.remove("active"),1000);
}

setInterval(breatheFire,4000);
breatheFire();
</script>

</body>
</html>
