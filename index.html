<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* CLOUD DASAR */
.cloud {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0.9;
  animation: moveClouds 60s linear infinite;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.08));
}

/* BENTUK AWAN (KAPAS) */
.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: #fff;
  border-radius: 50%;
}

.cloud::before {
  width: 120%;
  height: 120%;
  top: -40%;
  left: 15%;
}

.cloud::after {
  width: 140%;
  height: 140%;
  top: -60%;
  right: 10%;
}

/* POSISI AWAN */
.cloud1 {
  width: 260px;
  height: 80px;
  top: 100px;
  left: -300px;
}

.cloud2 {
  width: 320px;
  height: 90px;
  top: 220px;
  left: -450px;
  animation-duration: 75s;
}

.cloud3 {
  width: 240px;
  height: 75px;
  top: 350px;
  left: -250px;
  animation-duration: 65s;
}

.cloud4 {
  width: 280px;
  height: 85px;
  top: 160px;
  left: -500px;
  animation-duration: 85s;
}

/* GERAK */
@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}
</style>
</head>

<body>

<div class="hero">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="cloud cloud4"></div>
</div>

</body>
</html>
