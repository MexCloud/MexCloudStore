<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
}

/* BACKGROUND LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* AWAN */
.cloud {
  position: absolute;
  background: radial-gradient(circle at 30% 30%, #ffffff, #f2f2f2);
  border-radius: 50%;
  opacity: 0.9;
  filter: blur(0.3px);
  animation: moveClouds linear infinite;
  box-shadow: 0 10px 20px rgba(0,0,0,0.05);
}

/* layer awan biar “kapas” */
.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: radial-gradient(circle at 30% 30%, #ffffff, #f5f5f5);
  border-radius: 50%;
}

.cloud::before {
  width: 70%;
  height: 70%;
  top: -30%;
  left: 15%;
}

.cloud::after {
  width: 90%;
  height: 90%;
  top: -40%;
  right: 10%;
}

/* variasi */
.cloud1 {
  width: 220px;
  height: 70px;
  top: 80px;
  left: -250px;
}

.cloud2 {
  width: 280px;
  height: 80px;
  top: 200px;
  left: -350px;
  animation-duration: 55s;
}

.cloud3 {
  width: 200px;
  height: 65px;
  top: 350px;
  left: -300px;
  animation-duration: 45s;
}

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(150vw); }
}
}

}

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(140vw); }
}
</style>
</head>

<body>

<div class="hero">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
</div>

</body>
</html>
