<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      rgba(180,220,255,0.85),
      rgba(220,240,255,0.95)
    ),
    url('./sky.jpg');

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  z-index: 999;
}
.logo,
.cart {
    flex-shrink: 0;
}

.search-top {
  flex: 1;
  display: flex;
  justify-content: center;
  margin: 0 15px;
}
.cart {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-size: 20px;
}
.search-top input {
  width: 100%;
  max-width: 500px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}
#cart-count {
  background: red;
  color: white;
  padding: 3px 7px;
  border-radius: 50%;
  font-size: 12px;
}
/* BRAND */
.title {
  font-size: 50px;
  font-weight: 800;
}

.subtitle {
  letter-spacing: 5px;
}

/* KATALOG */
.catalog {
  padding: 30px;
  background: white;
}

.category {
  background: black;
  color: white;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.sub {
  display: none;
  padding-left: 15px;
}

.sub div {
  padding: 8px;
  cursor: pointer;
}

/* PRODUCTS */
.products {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card button {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: none;
  background: black;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

/* CART POPUP */
.cart-popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 9999;
}

.cart-box {
  background: white;
  width: 90%;
  max-width: 400px;
  margin: 100px auto;
  padding: 20px;
  border-radius: 10px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.cart-item button {
  background: red;
  color: white;
  border: none;
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
}
.card {
  transition: 0.2s ease;
}

.card:hover {
  transform: scale(1.05);
}
.hero {
  margin-top: 60px;
  height: 60vh;
  min-height: 420px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom, #6ec6ff, #bfe8ff);
}

/* CLOUD */
.cloud {
    position: absolute;
    left: -200px;
    width: 240px;
    opacity: 0.9;
    z-index: 2;

    animation: moveCloud 20s linear infinite;
}

/* gerak mulus kiri ke kanan */
@keyframes moveCloud {
  from {
    left: -200px;
  }
  to {
    left: 110%;
  }
}
.dragon {
  position: absolute;
  bottom: 70px;
  left: 50%;
  width: 420px;
  max-width: 80%;
  height: auto;
  transform: translateX(-50%);
  z-index: 3;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateX(-50%) translateY(0px); }
  50% { transform: translateX(-50%) translateY(-15px); }
  100% { transform: translateX(-50%) translateY(0px); }
}
 @media (max-width: 600px) {
  .dragon {
    width: 280px;
  }
  .cloud {
    width: 120px;
  }
}
.c1 { top:50px; animation-duration:18s; }
.c2 { top:140px; animation-duration:22s; }
.c3 { top:230px; animation-duration:26s; }
.c4 { top:320px; animation-duration:20s; }
.c5 { top:410px; animation-duration:24s; }
 .dragon {
  filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2));
}
 .cloud {
  pointer-events: none;
}
 /* LAYER PETIR */
.lightning {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}

/* ANIMASI PETIR */
 .lightning {
  background: radial-gradient(circle, white 0%, #aeefff 40%, transparent 70%);
}
 /* GARIS PETIR */
.lightning-bolt {
  position: absolute;
  top: 0;
  left: 50%;
  width: 100px;
  height: 80%;
  background: white;
  opacity: 0;
  z-index: 6;
  transform: translateX(-50%);
  clip-path: polygon(
    55% 0%,
    35% 35%,
    55% 35%,
    20% 70%,
    45% 70%,
    10% 100%,
    70% 55%,
    45% 55%,
    75% 20%
  );
  filter: drop-shadow(0 0 15px white);
}
/* ANIMASI PETIR TURUN */
@keyframes strike {
  0% {
    opacity: 0;
    transform: translateX(-50%) scaleY(0);
  }

  20% {
    opacity: 1;
    transform: translateX(-50%) scaleY(1);
  }

  40% {
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}
 .brand {
  text-align:center;
  position:absolute;
  top:10%;
  width:100%;
  z-index:7;
}
 .catalog {
  padding: 40px 30px;
  background: white;
}


.catalog-title {
  text-align: center;
  font-size: 35px;
  margin-bottom: 30px;
}


.catalog-grid {

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;

}


.category-card {

  background:black;
  color:white;
  padding:25px;
  border-radius:15px;
  text-align:center;
  font-size:20px;
  cursor:pointer;

  transition:.3s;

}


.category-card:hover {

 transform:translateY(-5px);

}



.subcategory {

 display:none;
 text-align:center;
 margin-top:25px;

}


.subcategory button {

 padding:12px 20px;
 margin:5px;

 border:none;
 border-radius:10px;

 background:#111;
 color:white;

 cursor:pointer;

}
</style>
</head>

<body>
<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">MexCloud</div>

  <div class="search-top">
    <input type="text" placeholder="Cari produk...">
  </div>

  <div class="cart" onclick="openCart()">
    🛒 <span id="cart-count">0</span>
  </div>
</div>

<!-- HERO -->
<div class="hero">

<div class="lightning"></div>
<div class="lightning-bolt"></div>

<img src="./cloud.png" class="cloud c1">
<img src="./cloud.png" class="cloud c2">
<img src="./cloud.png" class="cloud c3">
<img src="./cloud.png" class="cloud c4">
<img src="./cloud.png" class="cloud c5">

<img src="./dragon.png" class="dragon">

<div class="brand">
<h1 class="title">MexCloud Store</h1>
<h2 class="subtitle">BREATH THE VIBES</h2>
</div>

</div>

<!-- PRODUCT CATALOG -->
<section class="catalog" id="catalog">

<h2 class="catalog-title">
PRODUCT CATALOG
</h2>

<div class="catalog-grid">


<div class="category-card" onclick="toggleCategory('pod')">
💨 POD
</div>


<div class="category-card" onclick="toggleCategory('rokok')">
🚬 ROKOK
</div>


<div class="category-card" onclick="toggleCategory('obat')">
💊 OBAT INDONESIA
</div>


<div class="category-card" onclick="toggleCategory('handphone')">
📱 HANDPHONE
</div>


<div class="category-card" onclick="toggleCategory('parfume')">
🌸 PARFUME
</div>


</div>
<!-- SUB CATEGORY -->


<div class="subcategory" id="pod">

<button>DEVICE</button>
<button>SALTNIC FRUITY</button>
<button>SALTNIC CREAMY</button>
<button>CARTRIDGE</button>
<button>LIQUID FREEBASE</button>

</div>



<div class="subcategory" id="rokok">

<button>ROKOK INDONESIA</button>
<button>ROKOK CAMBODIA</button>

</div>



<div class="subcategory" id="obat">

<button>OBAT UMUM</button>
<button>OBAT 18+</button>

</div>



<div class="subcategory" id="handphone">

<button>SECOND HAND</button>
<button>BRAND NEW BOX</button>

</div>



<div class="subcategory" id="parfume">

<button>MEN</button>
<button>WOMEN</button>

</div>


</section>

<!-- CART POPUP -->
<div id="cart-popup" class="cart-popup">
  <div class="cart-box">
    <h3>🛒 Keranjang</h3>
    <div id="cart-items"></div>

    <br>
    <button onclick="checkoutTelegram()">Checkout Telegram</button>
    <button onclick="closeCart()">Tutup</button>
  </div>
</div>

<script>
let cart = [];

function addToCart(item) {
  cart.push(item);
  document.getElementById("cart-count").innerText = cart.length;
  renderCart();

  document.getElementById("cart-popup").style.display = "block";
}

function toggle(id) {
  let el = document.getElementById(id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function showProducts(type) {
  const data = {
    "obat-umum": ["Paracetamol", "Bodrex"],
    "obat-18": ["Obat Kuat A", "Obat Kuat B"],
    "Rokok Indonesia": ["Gudang Garam", "Marlboro"]
  };

  let container = document.getElementById("products");
  container.innerHTML = "";

  (data[type] || []).forEach(item => {
    container.innerHTML += `
      <div class="card">
        <h3>${item}</h3>
        <button onclick="addToCart('${item}')">Beli</button>
      </div>
    `;
  });
}

/* CART */
function closeCart() {
  document.getElementById("cart-popup").style.display = "none";
}
function renderCart() {
  let container = document.getElementById("cart-items");
  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = "<p>Cart masih kosong</p>";
    return;
  }

  cart.forEach((item, i) => {
    container.innerHTML += `
      <div class="cart-item">
        <span>${item}</span>
        <button onclick="removeItem(${i})">Hapus</button>
      </div>
    `;
  });
}
function removeItem(i) {
  cart.splice(i, 1);
  document.getElementById("cart-count").innerText = cart.length;
  renderCart();
}
 

/* CHECKOUT TELEGRAM */
function checkoutTelegram() {
  if (cart.length === 0) return alert("Cart kosong!");

  let msg = "Pesanan MexCloud:%0A";
  cart.forEach((item, i) => {
    msg += `${i+1}. ${item}%0A`;
  });

  let bot = "MexCloudStore";
window.open(`https://t.me/${bot}?text=${msg}`, "_blank");
}
function openCart() {
  document.getElementById("cart-popup").style.display = "block";
  renderCart();
}
function lightningStrike() {
  const flash = document.querySelector('.lightning');
  const bolt = document.querySelector('.lightning-bolt');

  if (!flash || !bolt) return;

  flash.style.opacity = "0.35";

  setTimeout(() => {
    flash.style.opacity = "0";
  }, 150);

  bolt.style.left = Math.random() * 80 + 10 + "%";

  bolt.style.animation = "none";
  void bolt.offsetWidth;
  bolt.style.animation = "strike 0.5s ease-out";

  setTimeout(lightningStrike, Math.random() * 6000 + 2000);
}
 function openCart() {
  document.getElementById("cart-popup").style.display = "block";
  renderCart();
}

// TAMBAHAN KATALOG BARU

function toggleCategory(id){

let all = document.querySelectorAll(".subcategory");

all.forEach(item=>{
 item.style.display="none";
});

let selected = document.getElementById(id);

if(selected){
 selected.style.display="block";
}

}

lightningStrike();
</script>

</body>
</html>
