<title>MexCloud Store</title>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      rgba(180,220,255,0.85),
      rgba(220,240,255,0.95)
    ),
    url('./sky.jpg');

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  z-index: 999;
}
.logo,
.cart {
    flex-shrink: 0;
}

.search-top {
  flex: 1;
  display: flex;
  justify-content: center;
  margin: 0 15px;
}
.cart {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-size: 20px;
}
.search-top input {
  width: 100%;
  max-width: 500px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}
#cart-count {
  background: red;
  color: white;
  padding: 3px 7px;
  border-radius: 50%;
  font-size: 12px;
}
/* BRAND */
.title {
  font-size: 50px;
  font-weight: 800;
}

.subtitle {
  letter-spacing: 5px;
}

/* KATALOG */
.category {
  background: black;
  color: white;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.sub {
  display: none;
  padding-left: 15px;
}

.sub div {
  padding: 8px;
  cursor: pointer;
}

/* PRODUCTS */
.products {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;

  display: flex;
  flex-direction: column;
}

.card button {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: none;
  background: black;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.cart-popup {
  display: block;
  position: fixed;
  top: 0;
  right: -400px;
  width: 380px;
  height: 100vh;
  background: white;
  z-index: 9999;
  transition: 0.35s ease;
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
}

.cart-popup.active {
  right: 0;
}

.cart-box {
  padding: 25px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.cart-item button {
  background: red;
  color: white;
  border: none;
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
}
.card {
  transition: 0.2s ease;
}

.card:hover {
  transform: scale(1.05);
}
.hero {
  margin-top: 60px;
  height: 60vh;
  min-height: 420px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom, #6ec6ff, #bfe8ff);
}

/* CLOUD */
.cloud {
    position: absolute;
    left: -200px;
    width: 240px;
    opacity: 0.9;
    z-index: 2;

    animation: moveCloud 20s linear infinite;
}

/* gerak mulus kiri ke kanan */
@keyframes moveCloud {
  from {
    left: -200px;
  }
  to {
    left: 110%;
  }
}
.dragon {
  position: absolute;
  bottom: 70px;
  left: 50%;
  width: 420px;
  max-width: 80%;
  height: auto;
  transform: translateX(-50%);
  z-index: 3;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateX(-50%) translateY(0px); }
  50% { transform: translateX(-50%) translateY(-15px); }
  100% { transform: translateX(-50%) translateY(0px); }
}
 @media (max-width: 600px) {
  .dragon {
    width: 280px;
  }
  .cloud {
    width: 120px;
  }
}
.c1 { top:50px; animation-duration:18s; }
.c2 { top:140px; animation-duration:22s; }
.c3 { top:230px; animation-duration:26s; }
.c4 { top:320px; animation-duration:20s; }
.c5 { top:410px; animation-duration:24s; }
 .dragon {
  filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2));
}
 .cloud {
  pointer-events: none;
}
 /* LAYER PETIR */
.lightning {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}

/* ANIMASI PETIR */
 .lightning {
  background: radial-gradient(circle, white 0%, #aeefff 40%, transparent 70%);
}
 /* GARIS PETIR */
.lightning-bolt {
  position: absolute;
  top: 0;
  left: 50%;
  width: 100px;
  height: 80%;
  background: white;
  opacity: 0;
  z-index: 6;
  transform: translateX(-50%);
  clip-path: polygon(
    55% 0%,
    35% 35%,
    55% 35%,
    20% 70%,
    45% 70%,
    10% 100%,
    70% 55%,
    45% 55%,
    75% 20%
  );
  filter: drop-shadow(0 0 15px white);
}
/* ANIMASI PETIR TURUN */
@keyframes strike {
  0% {
    opacity: 0;
    transform: translateX(-50%) scaleY(0);
  }

  20% {
    opacity: 1;
    transform: translateX(-50%) scaleY(1);
  }

  40% {
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}
 .brand {
  text-align:center;
  position:absolute;
  top:10%;
  width:100%;
  z-index:7;
}
.catalog {
  padding: 50px 30px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
}


.catalog-title {
  text-align: center;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 35px;
  color: #111;
  font-family: Arial, sans-serif;
}

/* PRODUCT CATEGORY PREMIUM */

.catalog-grid {

  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:25px;
  max-width:900px;
  margin:auto;

}


.category-card {

  height:160px;

  background:
  linear-gradient(
    145deg,
    rgba(0,0,0,0.95),
    rgba(40,40,40,0.85)
  );

  color:white;

  border-radius:25px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:26px;
  font-weight:900;

  letter-spacing:2px;

  cursor:pointer;

  box-shadow:
  0 15px 30px rgba(0,0,0,0.25);

  transition:.35s;

}


.category-card:hover {

  transform:
  translateY(-8px)
  scale(1.03);

  box-shadow:
  0 20px 40px rgba(0,0,0,0.35);

}



/* MOBILE */

function addToCart(id){
  const item = products.find(p => p.id === id);
  const exist = cart.find(p => p.id === id);

  if(exist){
    exist.qty += 1;
  }else{
    cart.push({...item, qty:1});
  }

updateCartCount();

  renderCart();
  openCart();
}

function showCategoryProducts(category){

let container;


if(category.includes("rokok")){

 container = document.getElementById("rokok-list");

}else if(category.includes("obat")){

 container = document.getElementById("obat-list");

}else if(category.includes("aksesoris")){

 container = document.getElementById("aksesoris-list");

}else{

 container = document.getElementById("product-list");

}

container.innerHTML="";


let filtered = products.filter(product => 
 product.category === category
);

  filtered.forEach(product => {

    container.innerHTML += `

    <div class="card">

      <img 
      src="${product.image}" 
      class="product-image"
      onclick="openImage('${product.image}')">

      <h3>${product.name}</h3>

      <div class="price">
      $${product.price} / Pcs
      </div>

     <div class="desc">
     ${product.desc.replaceAll("✅", "<br>✅")}
     </div>

      <button onclick="addToCart(${product.id})">
      Add to Cart
      </button>

    </div>

    `;

  });


const yOffset = -70;

const y = container.getBoundingClientRect().top 
+ window.pageYOffset 
+ yOffset;


window.scrollTo({
  top:y,
  behavior:"smooth"
});

}



// =================
// CART
// =================


function openCart(){

 document
 .getElementById("cart-popup")
 .classList.add("active");

 renderCart();

}


function closeCart(){

 document
 .getElementById("cart-popup")
 .classList.remove("active");

}



function renderCart(){
  let container = document.getElementById("cart-items");
  container.innerHTML = "";

  if(cart.length === 0){
    container.innerHTML = "<p>Cart masih kosong</p>";
    return;
  }

  let total = 0;

  cart.forEach((item,index)=>{

    let qty = item.qty || 1;
    let subtotal = item.price * qty;

    total += subtotal;

    container.innerHTML += `
    <div class="cart-item">
      <div>
        <b>${item.name}</b><br>
        $${item.price} x ${qty} = 
        <span style="color:#0b8f2f">$${subtotal}</span>
      </div>

<div>
  <button onclick="minusQty(${index})">-</button>
  <button onclick="plusQty(${index})">+</button>
  <button onclick="removeItem(${index})">❌</button>
</div>
    </div>
    `;
  });

  container.innerHTML += `
    <hr style="margin:10px 0;">
    <h3>Total: $${total}</h3>
  `;
}

function plusQty(i){
  cart[i].qty++;
 updateCartCount();
  renderCart();
}

function minusQty(i){
  if(cart[i].qty > 1){
    cart[i].qty--;
  }else{
    cart.splice(i,1);
  }
 updateCartCount();
  renderCart();
}

function removeItem(index){
  cart.splice(index,1);
  updateCartCount();
  renderCart();
}

function updateCartCount(){
  let totalQty = 0;

  cart.forEach(item=>{
    totalQty += item.qty || 1;
  });

  document.getElementById("cart-count").innerText = totalQty;
}
 document.querySelector('.search-top input')
.addEventListener('input', function(e){

  let keyword = e.target.value.toLowerCase();

  let filtered = products.filter(p =>
    p.name.toLowerCase().includes(keyword)
  );

  let container = document.getElementById("product-list");

  container.innerHTML = "";

  filtered.forEach(product => {

    container.innerHTML += `
    <div class="card">
      <img src="${product.image}" class="product-image">
      <h3>${product.name}</h3>
      <div class="price">$${product.price}</div>
      <button onclick="addToCart(${product.id})">Add</button>
    </div>
    `;
  });

});

}

 flash.style.opacity="0.35";


 setTimeout(()=>{

 flash.style.opacity="0";

 },150);



 bolt.style.left =
 Math.random()*80+10+"%";


 bolt.style.animation="none";


 void bolt.offsetWidth;


 bolt.style.animation=
 "strike 0.5s ease-out";



 setTimeout(
 lightningStrike,
 Math.random()*6000+2000
 );


}
