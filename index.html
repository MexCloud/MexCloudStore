<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MexCloud Store</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#222}
header{position:sticky;top:0;background:linear-gradient(90deg,#b266ff,#d8b4fe);padding:16px;text-align:center;color:#fff;font-size:28px;font-weight:bold;box-shadow:0 2px 10px #0002}
#cartBtn{position:fixed;top:15px;right:15px;background:#fff;border-radius:25px;padding:10px 14px;cursor:pointer;box-shadow:0 2px 10px #0003}
.badge{background:red;color:#fff;border-radius:20px;padding:2px 7px;font-size:12px}
.banner{margin:20px;background:#b266ff;color:#fff;padding:40px;border-radius:16px;text-align:center;font-size:28px}
.category{margin:15px;padding:15px;background:#f5f5f5;border-radius:10px;cursor:pointer;font-weight:bold}
.sub{display:none;padding:10px}
.product{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px;margin:10px 0;border-radius:10px;box-shadow:0 2px 8px #0002;transition:.25s}
.product:hover{transform:scale(1.03)}
button{background:#8b5cf6;color:#fff;border:none;border-radius:8px;padding:8px 12px;cursor:pointer}
#toast{position:fixed;right:20px;top:80px;background:#22c55e;color:#fff;padding:12px;border-radius:10px;display:none}
#cart{position:fixed;right:-380px;top:0;width:360px;height:100%;background:#fff;box-shadow:-2px 0 12px #0003;transition:.3s;padding:15px;overflow:auto}
#cart.open{right:0}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:8px 0}
.remove{background:#ef4444}
.checkout{width:100%;margin-top:10px}
.dragon{position:fixed;left:15px;bottom:15px;font-size:70px;opacity:.1;animation:f 6s infinite}
.fire{position:fixed;left:85px;bottom:75px;font-size:35px;opacity:0}
@keyframes f{50%{transform:translateY(-15px)}}
</style>
</head>
<body>

<header class="header">

    <div class="logo-title">
        <h2>🐉 MexCloud Store</h2>
    </div>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Cari produk..."
            onkeyup="searchProduct()">
    </div>

    <div id="cartBtn" class="cart-btn">
        🛒
        <span class="badge" id="count">0</span>
    </div>

</header>


<section class="hero">

    <div class="cloud-bg"></div>

    <img
        src="logo.png"
        class="dragon-logo"
        alt="MexCloud Logo">

    <h1>MexCloud Store</h1>

    <p>
        Premium Digital Marketplace
    </p>

</section>


<main class="container">

    <!-- Produk nanti di sini -->

</main>


<div id="toast">
    Produk berhasil ditambahkan.
</div>


<div id="cart">

    <h2>🛒 Keranjang</h2>

    <div id="items"></div>

    <h3>
        Total :
        $
        <span id="total">0</span>
    </h3>

    <button class="checkout" onclick="checkout()">
        Checkout Telegram
    </button>

</div>

</body>

<div id="toast">Produk berhasil ditambahkan.</div>

<div id="cart">
<h2>Keranjang</h2>
<div id="items"></div>
<h3>Total: $<span id="total">0</span></h3>
<button class="checkout" onclick="checkout()">Checkout Telegram</button>
</div>

<script>
let cart=[];
function tg(id){let e=document.getElementById(id);e.style.display=e.style.display=="block"?"none":"block";}
cartBtn.onclick=()=>cart.classList.toggle('open');
function add(n,p){cart.push({n,p});upd();toast.style.display='block';setTimeout(()=>toast.style.display='none',1800);}
function rem(i){cart.splice(i,1);upd();}
function upd(){count.innerText=cart.length;let t=0;items.innerHTML=cart.map((x,i)=>{t+=x.p;return `<div class=item><span>${x.n} - $${x.p}</span><button class="remove" onclick="rem(${i})">Hapus</button></div>`}).join('');total.innerText=t;}
function checkout(){let txt="🛒 MexCloud Order%0A";let tot=0;cart.forEach(x=>{tot+=x.p;txt+=`- ${x.n} ($${x.p})%0A`});txt+=`%0ATotal: $${tot}`;open("https://t.me/MexCloudStore?text="+txt)}
setInterval(()=>{fire.style.opacity=1;setTimeout(()=>fire.style.opacity=0,800)},4000);
</script>
</body></html>
