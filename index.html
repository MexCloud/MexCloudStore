<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
}

/* BACKGROUND LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* AWAN */
.cloud {
  position: absolute;
  background: #fff;
  border-radius: 100px;
  opacity: 0.9;
  animation: moveClouds 50s linear infinite;
  filter: drop-shadow(0 10px 15px rgba(0,0,0,0.08));
}

/* BAGIAN KAPAS UTAMA */
.cloud::before {
  content: "";
  position: absolute;
  background: #fff;
  width: 70%;
  height: 120%;
  top: -30%;
  left: 10%;
  border-radius: 50%;
}

.cloud::after {
  content: "";
  position: absolute;
  background: #fff;
  width: 90%;
  height: 140%;
  top: -40%;
  right: 10%;
  border-radius: 50%;
}

/* VARIASI AWAN */
.cloud1 {
  width: 220px;
  height: 70px;
  top: 80px;
  left: -250px;
}

.cloud2 {
  width: 280px;
  height: 80px;
  top: 200px;
  left: -350px;
  animation-duration: 60s;
}

.cloud3 {
  width: 200px;
  height: 65px;
  top: 350px;
  left: -300px;
  animation-duration: 55s;
}

/* GERAK */
@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(150vw); }
}
</style>
</head>

<body>

<div class="hero">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
</div>

</body>
</html>
