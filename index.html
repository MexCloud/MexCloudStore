<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
}

/* BACKGROUND LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* AWAN */
.cloud {
  position: absolute;
  background: white;
  border-radius: 50px;
  opacity: 0.8;
  filter: blur(1px);
  animation: moveClouds 30s linear infinite;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: white;
  border-radius: 50%;
}

/* variasi awan */
.cloud1 {
  width: 200px;
  height: 60px;
  top: 80px;
  left: -200px;
}

.cloud2 {
  width: 250px;
  height: 70px;
  top: 200px;
  left: -300px;
  animation-duration: 40s;
}

.cloud3 {
  width: 180px;
  height: 55px;
  top: 350px;
  left: -250px;
  animation-duration: 35s;
}

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(140vw); }
}
</style>
</head>

<body>

<div class="hero">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
</div>

</body>
</html>
