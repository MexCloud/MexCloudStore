<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}

body{
background:black;
color:white;
overflow-x:hidden;
}

/* ☁️ BACKGROUND AWAN FIX */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.75) contrast(1.1);
}

.overlay{
position:fixed;
inset:0;
background:radial-gradient(circle,rgba(0,0,0,0.2),rgba(0,0,0,0.92));
z-index:-1;
}

/* HEADER */
header{
display:flex;
align-items:center;
justify-content:space-between;
padding:10px;
background:rgba(0,0,0,0.5);
backdrop-filter:blur(10px);
position:sticky;
top:0;
z-index:10;
}

.logo{display:flex;align-items:center;gap:10px}
.logo img{width:40px}

input{
padding:8px;
border-radius:8px;
border:none;
outline:none;
width:200px;
}

/* GRID */
.container{padding:15px}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
}

.card{
background:rgba(255,255,255,0.06);
padding:10px;
border-radius:12px;
border:1px solid rgba(255,255,255,0.1);
}

button{
margin-top:6px;
width:100%;
padding:7px;
border:none;
border-radius:8px;
cursor:pointer;
background:red;
color:white;
}

/* CART */
.cart{
position:fixed;
right:0;
top:0;
width:320px;
height:100%;
background:black;
border-left:1px solid #333;
padding:10px;
overflow:auto;
}

.item{
display:flex;
justify-content:space-between;
align-items:center;
margin:10px 0;
border-bottom:1px solid #333;
padding-bottom:6px;
}

.qty button{
width:26px;
height:26px;
}

/* TOTAL */
.total{
margin-top:10px;
font-weight:bold;
}

/* ORDER */
.order{
background:green;
padding:10px;
width:100%;
margin-top:10px;
border-radius:8px;
cursor:pointer;
}
</style>
</head>

<body>

<!-- ☁️ AWAN -->
<video class="bg" autoplay muted loop playsinline>
<source src="https://cdn.pixabay.com/video/2023/06/20/169070-838331871_large.mp4">
</video>
<div class="overlay"></div>

<header>
<div class="logo">
<img src="logo.png">
<h3>MexCloud</h3>
</div>

<input id="search" placeholder="Cari produk...">
</header>

<div class="container">
<div class="grid" id="grid"></div>
</div>

<!-- CART -->
<div class="cart">
<h3>Keranjang</h3>
<div id="cart"></div>

<div class="total" id="total">Total: Rp 0</div>

<button class="order" onclick="orderTelegram()">
📩 Order ke Telegram
</button>
</div>

<script>
let products = [
{id:1,name:"Panel Basic",price:10000},
{id:2,name:"Panel Pro",price:25000},
{id:3,name:"Panel VIP",price:50000}
];

let cart = [];

/* RENDER PRODUK */
function render(list = products){
let g=document.getElementById("grid");
g.innerHTML="";

list.forEach(p=>{
g.innerHTML+=`
<div class="card">
<h4>${p.name}</h4>
<p>Rp ${p.price}</p>
<button onclick="add(${p.id})">Tambah</button>
</div>`;
});
}
render();

/* ADD CART */
function add(id){
let p=products.find(x=>x.id===id);
let c=cart.find(x=>x.id===id);

if(c){
c.qty++;
}else{
cart.push({...p,qty:1});
}
updateCart();
}

/* UPDATE CART */
function updateCart(){
let box=document.getElementById("cart");
box.innerHTML="";

let total=0;

cart.forEach((x,i)=>{
total += x.price * x.qty;

box.innerHTML+=`
<div class="item">
<div>
<b>${x.name}</b><br>
Rp ${x.price}
</div>

<div class="qty">
<button onclick="minus(${i})">-</button>
${x.qty}
<button onclick="plus(${i})">+</button>
</div>
</div>`;
});

document.getElementById("total").innerText="Total: Rp "+total;
}

/* QTY */
function plus(i){cart[i].qty++;updateCart()}
function minus(i){
cart[i].qty--;
if(cart[i].qty<=0)cart.splice(i,1);
updateCart();
}

/* TELEGRAM FIX */
function orderTelegram(){
if(cart.length===0){
alert("Keranjang kosong");
return;
}

let msg="Order MexCloud Store:%0A";
let total=0;

cart.forEach(x=>{
msg+=`- ${x.name} x${x.qty}%0A`;
total += x.price * x.qty;
});

msg+=`%0ATotal: Rp ${total}`;

/* GANTI USERNAME TELEGRAM KAMU */
let telegramUsername="USERNAME_KAMU";

let url=`https://t.me/${telegramUsername}?text=${encodeURIComponent(msg)}`;

window.open(url,"_blank");
}

/* SEARCH FIX */
document.getElementById("search").addEventListener("input",e=>{
let val=e.target.value.toLowerCase();
render(products.filter(p=>p.name.toLowerCase().includes(val)));
});
</script>

</body>
</html>
