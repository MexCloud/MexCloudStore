<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
overflow:hidden;
background:#000;
color:white;
}

/* ☁️ AWAN PUTIH (CLEAN CLOUD EFFECT) */
.clouds{
position:fixed;
width:200%;
height:100%;
background:
radial-gradient(circle at 20% 30%, rgba(255,255,255,0.25), transparent 40%),
radial-gradient(circle at 60% 50%, rgba(255,255,255,0.2), transparent 45%),
radial-gradient(circle at 80% 20%, rgba(255,255,255,0.15), transparent 40%);
animation:moveClouds 20s linear infinite;
z-index:-2;
}

@keyframes moveClouds{
0%{transform:translateX(0);}
100%{transform:translateX(-50%);}
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,0.55);
z-index:-1;
}

/* 🧱 BANNER PERSEGI */
.banner{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
gap:15px;
}

/* SEARCH */
.search{
width:300px;
}

.search input{
width:100%;
padding:10px;
border-radius:10px;
border:none;
outline:none;
}

/* 🐉 LOGO BESAR */
.logo{
width:320px;
filter:drop-shadow(0 0 25px red);
animation:float 3s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-15px);}
}

/* TEXT */
.title{
font-size:40px;
font-weight:bold;
}

.subtitle{
font-size:18px;
opacity:0.8;
letter-spacing:2px;
}
</style>
</head>

<body>

<div class="clouds"></div>
<div class="overlay"></div>

<div class="banner">

<!-- SEARCH BAR -->
<div class="search">
<input placeholder="Search...">
</div>

<!-- LOGO NAGA -->
<img class="logo" src="logo.png">

<!-- TEXT -->
<div class="title">MexCloud Store</div>
<div class="subtitle">Breath The Vibes</div>

</div>

</body>
</html>
