<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow-x: hidden;
  font-family: Arial, sans-serif;
}

/* BACKGROUND LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* AWAN */
.cloud {
  position: absolute;
  background: #fff;
  border-radius: 100px;
  opacity: 0.9;
  filter: blur(0.8px);
  animation: moveClouds 60s linear infinite;
}

/* bikin “gumpalan awan” */
.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: #fff;
  border-radius: 50%;
}

/* bentuk layer awan */
.cloud::before {
  width: 120%;
  height: 120%;
  top: -35%;
  left: 15%;
}

.cloud::after {
  width: 140%;
  height: 140%;
  top: -45%;
  right: 10%;
}

/* VARIASI BIAR TIDAK BOLA */
.cloud1 {
  width: 260px;
  height: 80px;
  top: 80px;
  left: -300px;
}

.cloud2 {
  width: 320px;
  height: 90px;
  top: 180px;
  left: -400px;
  animation-duration: 70s;
}

.cloud3 {
  width: 220px;
  height: 70px;
  top: 320px;
  left: -250px;
  animation-duration: 55s;
}

.cloud4 {
  width: 280px;
  height: 85px;
  top: 120px;
  left: -500px;
  animation-duration: 80s;
}

.cloud5 {
  width: 240px;
  height: 75px;
  top: 260px;
  left: -450px;
  animation-duration: 65s;
}

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}
}
</style>
</head>

<body>

<div class="hero">
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="cloud cloud4"></div>
<div class="cloud cloud5"></div>
</div>

</body>
</html>
