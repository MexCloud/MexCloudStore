<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      rgba(180,220,255,0.85),
      rgba(220,240,255,0.95)
    ),
    url('./sky.jpg');

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  z-index: 999;
}
.logo,
.cart {
    flex-shrink: 0;
}

.search-top {
  flex: 1;
  display: flex;
  justify-content: center;
  margin: 0 15px;
}
.cart {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-size: 20px;
}
.search-top input {
  width: 100%;
  max-width: 500px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}
#cart-count {
  background: red;
  color: white;
  padding: 3px 7px;
  border-radius: 50%;
  font-size: 12px;
}
/* BRAND */
.title {
  font-size: 50px;
  font-weight: 800;
}

.subtitle {
  letter-spacing: 5px;
}

/* KATALOG */
.category {
  background: black;
  color: white;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.sub {
  display: none;
  padding-left: 15px;
}

.sub div {
  padding: 8px;
  cursor: pointer;
}

/* PRODUCTS */
.products {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card button {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: none;
  background: black;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

/* CART POPUP */
.cart-popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 9999;
}

.cart-box {
  background: white;
  width: 90%;
  max-width: 400px;
  margin: 100px auto;
  padding: 20px;
  border-radius: 10px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.cart-item button {
  background: red;
  color: white;
  border: none;
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
}
.card {
  transition: 0.2s ease;
}

.card:hover {
  transform: scale(1.05);
}
.hero {
  margin-top: 60px;
  height: 60vh;
  min-height: 420px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom, #6ec6ff, #bfe8ff);
}

/* CLOUD */
.cloud {
    position: absolute;
    left: -200px;
    width: 240px;
    opacity: 0.9;
    z-index: 2;

    animation: moveCloud 20s linear infinite;
}

/* gerak mulus kiri ke kanan */
@keyframes moveCloud {
  from {
    left: -200px;
  }
  to {
    left: 110%;
  }
}
.dragon {
  position: absolute;
  bottom: 70px;
  left: 50%;
  width: 420px;
  max-width: 80%;
  height: auto;
  transform: translateX(-50%);
  z-index: 3;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateX(-50%) translateY(0px); }
  50% { transform: translateX(-50%) translateY(-15px); }
  100% { transform: translateX(-50%) translateY(0px); }
}
 @media (max-width: 600px) {
  .dragon {
    width: 280px;
  }
  .cloud {
    width: 120px;
  }
}
.c1 { top:50px; animation-duration:18s; }
.c2 { top:140px; animation-duration:22s; }
.c3 { top:230px; animation-duration:26s; }
.c4 { top:320px; animation-duration:20s; }
.c5 { top:410px; animation-duration:24s; }
 .dragon {
  filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2));
}
 .cloud {
  pointer-events: none;
}
 /* LAYER PETIR */
.lightning {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}

/* ANIMASI PETIR */
 .lightning {
  background: radial-gradient(circle, white 0%, #aeefff 40%, transparent 70%);
}
 /* GARIS PETIR */
.lightning-bolt {
  position: absolute;
  top: 0;
  left: 50%;
  width: 100px;
  height: 80%;
  background: white;
  opacity: 0;
  z-index: 6;
  transform: translateX(-50%);
  clip-path: polygon(
    55% 0%,
    35% 35%,
    55% 35%,
    20% 70%,
    45% 70%,
    10% 100%,
    70% 55%,
    45% 55%,
    75% 20%
  );
  filter: drop-shadow(0 0 15px white);
}
/* ANIMASI PETIR TURUN */
@keyframes strike {
  0% {
    opacity: 0;
    transform: translateX(-50%) scaleY(0);
  }

  20% {
    opacity: 1;
    transform: translateX(-50%) scaleY(1);
  }

  40% {
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}
 .brand {
  text-align:center;
  position:absolute;
  top:10%;
  width:100%;
  z-index:7;
}
.catalog {
  padding: 50px 30px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
}


.catalog-title {
  text-align: center;
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 35px;
  color: #111;
  font-family: Arial, sans-serif;
}


.catalog-grid {

  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:20px;

}


/* PRODUCT CATEGORY PREMIUM */

.catalog-grid {

  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:25px;
  max-width:900px;
  margin:auto;

}


.category-card {

  height:160px;

  background:
  linear-gradient(
    145deg,
    rgba(0,0,0,0.95),
    rgba(40,40,40,0.85)
  );

  color:white;

  border-radius:25px;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  font-size:26px;
  font-weight:900;

  letter-spacing:2px;

  cursor:pointer;

  box-shadow:
  0 15px 30px rgba(0,0,0,0.25);

  transition:.35s;

}


.category-card:hover {

  transform:
  translateY(-8px)
  scale(1.03);

  box-shadow:
  0 20px 40px rgba(0,0,0,0.35);

}



/* MOBILE */

@media(max-width:600px){

.catalog-grid{

grid-template-columns:1fr;

}


.category-card{

height:130px;
font-size:22px;

}

}



.subcategory {

 display:none;
 text-align:center;
 margin-top:25px;

}


.subcategory button {

 padding:12px 20px;
 margin:5px;

 border:none;
 border-radius:10px;

 background:#111;
 color:white;

 cursor:pointer;

}
 .product-image{
width:100%;
height:160px;
object-fit:cover;
border-radius:10px;
margin-bottom:10px;
}

.price{
font-size:20px;
font-weight:bold;
color:#0b8f2f;
margin-top:5px;
}

.desc{
font-size:13px;
color:#666;
margin-top:5px;
margin-bottom:10px;
}

.card button{
margin-top:auto;
}
 .product-image{
  cursor:pointer;
  transition:0.2s;
}

.product-image:hover{
  transform:scale(1.05);
}
</style>
</head>

<body>
<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">MexCloud</div>

  <div class="search-top">
    <input type="text" placeholder="Cari produk...">
  </div>

  <div class="cart" onclick="openCart()">
    🛒 <span id="cart-count">0</span>
  </div>
</div>

<!-- HERO -->
<div class="hero">

<div class="lightning"></div>
<div class="lightning-bolt"></div>

<img src="./cloud.png" class="cloud c1">
<img src="./cloud.png" class="cloud c2">
<img src="./cloud.png" class="cloud c3">
<img src="./cloud.png" class="cloud c4">
<img src="./cloud.png" class="cloud c5">

<img src="./dragon.png" class="dragon">

<div class="brand">
<h1 class="title">MexCloud Store</h1>
<h2 class="subtitle">BREATH THE VIBES</h2>
</div>

</div>

<!-- PRODUCT CATALOG -->
<section class="catalog" id="catalog">

<h2 class="catalog-title">
OUR PRODUCTS
</h2>

<div class="catalog-grid">


<div class="category-card" onclick="toggleCategory('pod')">
💨 POD
</div>


<div class="category-card" onclick="toggleCategory('rokok')">
🚬 ROKOK
</div>


<div class="category-card" onclick="toggleCategory('obat')">
💊 OBAT INDONESIA
</div>


<div class="category-card" onclick="toggleCategory('handphone')">
📱 HANDPHONE
</div>


<div class="category-card" onclick="toggleCategory('parfume')">
🌸 PARFUME
</div>


</div>
<!-- SUB CATEGORY -->


<div class="subcategory" id="pod">

<button onclick="showCategoryProducts('device')">DEVICE</button>
<button onclick="showCategoryProducts('fruity')">SALTNIC FRUITY</button>
<button onclick="showCategoryProducts('creamy')">SALTNIC CREAMY</button>
<button onclick="showCategoryProducts('cartridge')">CARTRIDGE</button>
<button onclick="showCategoryProducts('freebase')">LIQUID FREEBASE</button>

 <div class="products" id="product-list"></div>

</div>
 
<div class="subcategory" id="rokok">

<button>ROKOK INDONESIA</button>
<button>ROKOK CAMBODIA</button>

</div>



<div class="subcategory" id="obat">

<button>OBAT UMUM</button>
<button>OBAT 18+</button>

</div>



<div class="subcategory" id="handphone">

<button>SECOND HAND</button>
<button>BRAND NEW BOX</button>

</div>



<div class="subcategory" id="parfume">

<button>MEN</button>
<button>WOMEN</button>

</div>


</section>

<!-- CART POPUP -->
<div id="cart-popup" class="cart-popup">
  <div class="cart-box">
    <h3>🛒 Keranjang</h3>
    <div id="cart-items"></div>

    <br>
    <button onclick="checkoutTelegram()">Checkout Telegram</button>
    <button onclick="closeCart()">Tutup</button>
  </div>
</div>
 <!-- IMAGE POPUP -->
<div id="img-popup" style="
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:99999;
">

<img id="popup-img" style="
max-width:90%;
max-height:90%;
border-radius:10px;
">

</div>

<script>
 let cart = [];
 const products = [
  {
    id: 1,
    category: "device",
    name: "OXVA XLIM PRO 2",
    price: 25,
    desc: "Original Device",
    image: "./images/xlimpro2.jpg"
  },
  {
    id: 2,
    category: "device",
    name: "OXVA XLIM GO",
    price: 18,
    desc: "Original Device",
    image: "./images/xlimgo.jpg"
  },
  {
    id: 3,
    category: "fruity",
    name: "Tokyo Mango",
    price: 9,
    desc: "30ml Saltnic",
    image: "./images/tokyo-coklat.jpg"
  }
];

function addToCart(item) {
  cart.push(item);
  document.getElementById("cart-count").innerText = cart.length;
  renderCart();

  document.getElementById("cart-popup").style.display = "block";
}

function toggle(id) {
  let el = document.getElementById(id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}
function showCategoryProducts(category){

  const container = document.getElementById("product-list");

  container.innerHTML = "";

  const filtered = products.filter(product => 
    product.category === category
  );


  filtered.forEach(product => {

    container.innerHTML += `
      <div class="card">

       <img src="${product.image}" class="product-image"
onclick="openImage('${product.image}')">

        <h3>${product.name}</h3>

        <div class="price">
          $${product.price} USD
        </div>

        <div class="desc">
          ${product.desc}
        </div>

<button onclick='addToCart(${JSON.stringify(product)})'>
  Add to Cart
</button>

      </div>
    `;

  });

}

/* CART */
function closeCart() {
  document.getElementById("cart-popup").style.display = "none";
}
function renderCart() {
  let container = document.getElementById("cart-items");
  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = "<p>Cart masih kosong</p>";
    return;
  }

  cart.forEach((item, i) => {
    container.innerHTML += `
      <div class="cart-item">
       <span>${item.name}</span>
        <button onclick="removeItem(${i})">Hapus</button>
      </div>
    `;
  });
}
function removeItem(i) {
  cart.splice(i, 1);
  document.getElementById("cart-count").innerText = cart.length;
  renderCart();
}
 

/* CHECKOUT TELEGRAM */
function checkoutTelegram() {
  if (cart.length === 0) return alert("Cart kosong!");

  let msg = "Pesanan MexCloud:%0A";
  cart.forEach((item, i) => {
    msg += `${i+1}. ${item.name} $${item.price}%0A`;
});

  let bot = "MexCloudStore";
window.open(`https://t.me/${bot}?text=${msg}`, "_blank");
}
function openCart() {
  document.getElementById("cart-popup").style.display = "block";
  renderCart();
}
function lightningStrike() {
  const flash = document.querySelector('.lightning');
  const bolt = document.querySelector('.lightning-bolt');

  if (!flash || !bolt) return;

  flash.style.opacity = "0.35";

  setTimeout(() => {
    flash.style.opacity = "0";
  }, 150);

  bolt.style.left = Math.random() * 80 + 10 + "%";

  bolt.style.animation = "none";
  void bolt.offsetWidth;
  bolt.style.animation = "strike 0.5s ease-out";

  setTimeout(lightningStrike, Math.random() * 6000 + 2000);
}

// TAMBAHAN KATALOG BARU

function toggleCategory(id){

let all = document.querySelectorAll(".subcategory");

all.forEach(item=>{
 item.style.display="none";
});

let selected = document.getElementById(id);

if(selected){
 selected.style.display="block";
}

}
function openImage(src){

  let popup = document.getElementById("img-popup");

  popup.style.display = "flex";
  document.getElementById("popup-img").src = src;

  history.pushState({popup:true}, "");
}


function closeImage(){

  document.getElementById("img-popup").style.display = "none";

}


// klik background hitam
document.getElementById("img-popup").addEventListener("click", function(e){

  if(e.target === this){
    closeImage();

    if(history.state && history.state.popup){
      history.back();
    }
  }

});


// tombol ESC desktop
document.addEventListener("keydown", function(e){

  if(e.key === "Escape"){
    closeImage();
  }

});


// tombol back browser
window.addEventListener("popstate", function(){

  let popup = document.getElementById("img-popup");

  if(popup.style.display === "flex"){
    popup.style.display = "none";
  }

});

lightningStrike();
</script>

</body>
</html>
