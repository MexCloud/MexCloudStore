<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  overflow: hidden;
  background: black;
}

/* Background awan (video) */
.bg-video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: -2;
  filter: brightness(0.6);
}

/* Overlay gelap biar premium */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle, rgba(0,0,0,0.2), rgba(0,0,0,0.9));
  z-index: -1;
}

/* Container */
.container {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* Logo naga */
.dragon {
  width: 300px;
  animation: float 3s ease-in-out infinite;
  filter: drop-shadow(0 0 20px red);
}

/* Animasi api glow */
@keyframes fireGlow {
  0%, 100% { filter: drop-shadow(0 0 10px red); }
  50% { filter: drop-shadow(0 0 30px orange); }
}

.dragon.fire {
  animation: fireGlow 0.6s ease-in-out;
}

/* teks */
.title {
  font-size: 48px;
  font-weight: bold;
  color: white;
  letter-spacing: 2px;
  margin-top: 20px;
}

.subtitle {
  font-size: 20px;
  color: #ccc;
  margin-top: 10px;
}

/* floating */
@keyframes float {
  0%,100% { transform: translateY(0px); }
  50% { transform: translateY(-20px); }
}
</style>
</head>

<body>

<!-- VIDEO BACKGROUND AWAN -->
<video class="bg-video" autoplay muted loop>
  <source src="https://cdn.pixabay.com/video/2023/06/20/169070-838331871_large.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<div class="container">
  <img id="dragon" class="dragon" src="https://via.placeholder.com/300x300.png?text=DRAGON" />

  <div class="title">MexCloud Store</div>
  <div class="subtitle">Breath The Vibe</div>
</div>

<script>
// animasi api tiap 4 detik
setInterval(() => {
  const dragon = document.getElementById("dragon");
  dragon.classList.add("fire");

  setTimeout(() => {
    dragon.classList.remove("fire");
  }, 600);
}, 4000);
</script>

</body>
</html>
