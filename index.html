<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* CLOUD DASAR */
.cloud {
  position: absolute;
  width: 250px;
  opacity: 0.9;
  animation: moveClouds 60s linear infinite;
}

.cloud1 { top: 80px; left: -300px; }
.cloud2 { top: 200px; left: -400px; animation-duration: 80s; }
.cloud3 { top: 350px; left: -250px; animation-duration: 70s; }

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}

/* blob kiri */
.cloud::before {
  content: "";
  position: absolute;
  width: 90%;
  height: 120%;
  top: -30%;
  left: 5%;
  background: #fff;
  border-radius: 60% 40% 60% 40%;
}

.cloud::after {
  content: "";
  position: absolute;
  width: 110%;
  height: 130%;
  top: -50%;
  right: 0;
  background: #fff;
  border-radius: 40% 60% 50% 50%;
}

/* tambahan blob tengah (INI YANG BIKIN NGGAK BULAT) */
.cloud {
  box-shadow:
    60px -20px 0 0 #fff,
    120px 0px 0 0 #fff,
    30px 20px 0 0 #fff,
    90px 30px 0 0 #fff;
}

/* VARIASI */
.cloud1 { width: 180px; height: 60px; top: 100px; left: -250px; }
.cloud2 { width: 220px; height: 70px; top: 220px; left: -400px; animation-duration: 80s; }
.cloud3 { width: 160px; height: 55px; top: 350px; left: -300px; animation-duration: 75s; }

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}
</style>
</head>

<body>

<div class="hero">
<img class="cloud cloud1" src="https://i.ibb.co/7QpKsCX/cloud1.png">
<img class="cloud cloud2" src="https://i.ibb.co/7QpKsCX/cloud1.png">
<img class="cloud cloud3" src="https://i.ibb.co/7QpKsCX/cloud1.png">
</div>

</body>
</html>
