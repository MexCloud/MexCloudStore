<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* HERO / LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* CLOUD */
.cloud {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  animation: moveClouds 70s linear infinite;
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.08));
}

/* bentuk awan */
.cloud::before {
  content: "";
  position: absolute;
  background: #fff;
  width: 120%;
  height: 120%;
  top: -40%;
  left: 10%;
  border-radius: 50%;
}

.cloud::after {
  content: "";
  position: absolute;
  background: #fff;
  width: 140%;
  height: 140%;
  top: -60%;
  right: 5%;
  border-radius: 50%;
}

/* VARIASI CLOUD */
.cloud1 {
  width: 260px;
  height: 90px;
  top: 80px;
  left: -300px;
}

.cloud2 {
  width: 320px;
  height: 100px;
  top: 200px;
  left: -400px;
  animation-duration: 85s;
}

.cloud3 {
  width: 240px;
  height: 80px;
  top: 350px;
  left: -250px;
  animation-duration: 75s;
}

.cloud4 {
  width: 300px;
  height: 95px;
  top: 130px;
  left: -500px;
  animation-duration: 90s;
}

.cloud5 {
  width: 220px;
  height: 75px;
  top: 260px;
  left: -450px;
  animation-duration: 80s;
}

/* ANIMASI */
@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}
</style>
</head>

<body>

<div class="hero">
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="cloud cloud4"></div>
<div class="cloud cloud5"></div>
</div>

</body>
</html>
