<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* HERO */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* CLOUD */
.cloud {
  position: absolute;
  width: 250px;
  opacity: 0.9;
  animation: moveClouds 60s linear infinite;
  pointer-events: none;
}

.cloud1 { top: 80px; left: -300px; }
.cloud2 { top: 200px; left: -400px; animation-duration: 80s; }
.cloud3 { top: 350px; left: -250px; animation-duration: 70s; }

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}

/* DRAGON */
.dragon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 370px;
  z-index: 10;
  filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
  animation: floatDragon 4s ease-in-out infinite;
}

@keyframes floatDragon {
  0% { transform: translate(-50%, -50%) translateY(0px); }
  50% { transform: translate(-50%, -50%) translateY(-12px); }
  100% { transform: translate(-50%, -50%) translateY(0px); }
}

/* BRAND */
.brand {
  position: absolute;
  top: 10%;
  width: 100%;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}

.title {
  font-size: 52px;
  margin: 0;
  color: black;
  font-weight: 800;
  text-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

.subtitle {
  font-size: 18px;
  margin-top: 10px;
  letter-spacing: 6px;
  color: black;
}
  
/* SEARCH */
.search-box {
  position: absolute;
  top: 28%;
  width: 100%;
  text-align: center;
  z-index: 6;
}

.search-box input {
  width: 50%;
  padding: 14px;
  border-radius: 12px;
  border: none;
  outline: none;
}
</style>
</head>

<body>

<div class="hero">

  <!-- CLOUD (pakai cache buster biar GitHub gak ngelag) -->
  <img class="cloud cloud1" src="./cloud.png?v=1">
  <img class="cloud cloud2" src="./cloud.png?v=1">
  <img class="cloud cloud3" src="./cloud.png?v=1">
  
  <div class="brand">
  <h1 class="title">MexCloud Store</h1>
  <h2 class="subtitle">BREATH THE VIBES</h2>
</div>
  
  <div class="search-box">
  <input type="text" placeholder="Cari produk...">
</div>
  
  <!-- DRAGON -->
  <img class="dragon" src="./dragon.png?v=1" alt="dragon">

</div>

</body>
</html>
