<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* LANGIT */
.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  background: linear-gradient(to bottom, #6ec6ff, #ffffff);
  overflow: hidden;
}

/* CLOUD DASAR */
.cloud {
  position: absolute;
  background: #fff;
  border-radius: 50%;
  opacity: 0.9;
  animation: moveClouds 70s linear infinite;
  filter: blur(0.6px);
}

/* banyak “blob kecil” jadi 1 awan */
.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  background: #fff;
  border-radius: 50%;
}

/* blob kiri */
.cloud::before {
  width: 60%;
  height: 80%;
  top: -20%;
  left: 10%;
}

/* blob kanan */
.cloud::after {
  width: 80%;
  height: 100%;
  top: -35%;
  right: 5%;
}

/* tambahan blob tengah (INI YANG BIKIN NGGAK BULAT) */
.cloud {
  box-shadow:
    60px -20px 0 0 #fff,
    120px 0px 0 0 #fff,
    30px 20px 0 0 #fff,
    90px 30px 0 0 #fff;
}

/* VARIASI */
.cloud1 { width: 180px; height: 60px; top: 100px; left: -250px; }
.cloud2 { width: 220px; height: 70px; top: 220px; left: -400px; animation-duration: 80s; }
.cloud3 { width: 160px; height: 55px; top: 350px; left: -300px; animation-duration: 75s; }

@keyframes moveClouds {
  from { transform: translateX(0); }
  to { transform: translateX(160vw); }
}
</style>
</head>

<body>

<div class="hero">
  <div class="cloud cloud1"></div>
  <div class="cloud cloud2"></div>
  <div class="cloud cloud3"></div>
  <div class="cloud cloud4"></div>
</div>

</body>
</html>
