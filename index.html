<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body{
  margin:0;
  overflow:hidden;
  background: radial-gradient(circle at top, #0b0f2a, #050611);
  font-family:Arial;
  color:white;
}

/* ===== CLOUD LAYERS ===== */
.cloud {
  position:absolute;
  width:300%;
  height:300px;
  background:url("https://i.imgur.com/3QKQ9hY.png");
  opacity:0.15;
  animation:move 80s linear infinite;
}

.cloud2 {
  position:absolute;
  top:40px;
  width:300%;
  height:300px;
  background:url("https://i.imgur.com/3QKQ9hY.png");
  opacity:0.08;
  animation:move 140s linear infinite reverse;
}

.cloud3 {
  position:absolute;
  top:80px;
  width:300%;
  height:300px;
  background:url("https://i.imgur.com/3QKQ9hY.png");
  opacity:0.05;
  animation:move 200s linear infinite;
}

@keyframes move{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* ===== CENTER ===== */
.center{
  position:absolute;
  top:120px;
  width:100%;
  text-align:center;
  z-index:5;
}

/* ===== DRAGON ===== */
.dragon{
  width:320px;
  filter:drop-shadow(0 0 30px red);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-18px);}
}

/* glow pulse */
.dragon-glow{
  position:absolute;
  left:50%;
  top:110px;
  transform:translateX(-50%);
  width:360px;
  height:360px;
  background:radial-gradient(circle, rgba(255,0,0,0.25), transparent 70%);
  filter:blur(20px);
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{opacity:0.3; transform:translateX(-50%) scale(1);}
  50%{opacity:0.7; transform:translateX(-50%) scale(1.1);}
}

/* ===== FIRE BREATH ===== */
.fire{
  position:absolute;
  left:50%;
  top:180px;
  transform:translateX(-50%);
  width:10px;
  height:10px;
  background:radial-gradient(circle, orange, red, transparent);
  border-radius:50%;
  opacity:0;
  filter:blur(2px);
}

.fire.active{
  animation:fireBlast 1s ease-out;
}

@keyframes fireBlast{
  0%{width:10px;height:10px;opacity:0;}
  20%{opacity:1;}
  100%{width:500px;height:120px;opacity:0;}
}

/* ===== TEXT ===== */
.title{
  font-size:46px;
  font-weight:bold;
  background:linear-gradient(90deg,gold,orange,red);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.sub{
  font-size:18px;
  opacity:0.8;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="cloud"></div>
<div class="cloud2"></div>
<div class="cloud3"></div>

<div class="center">

  <div class="dragon-glow"></div>

  <!-- DRAGON SVG (lebih detail dari sebelumnya) -->
  <svg class="dragon" viewBox="0 0 512 512">
    <path fill="#ff2b2b" d="M256 40c70 40 110 110 90 180-15 55-70 85-70 130 0 50 70 80 110 130-100-20-150-70-170-120-20 50-70 100-170 120 40-50 110-80 110-130 0-45-55-75-70-130C146 150 186 80 256 40z"/>
  </svg>

  <div class="fire" id="fire"></div>

  <div class="title">MexCloud Store</div>
  <div class="sub">Breath The Vibe</div>

</div>

<script>
const fire = document.getElementById("fire");

function breatheFire(){
  fire.classList.add("active");
  setTimeout(()=> fire.classList.remove("active"), 1000);
}

// tiap 4 detik
setInterval(breatheFire, 4000);
breatheFire();
</script>

</body>
</html>
