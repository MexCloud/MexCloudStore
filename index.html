<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background: radial-gradient(circle at top, #1a1f3c, #050611);
  color:white;
}

/* ===== AWAN MULTI LAYER ===== */
.clouds, .clouds2 {
  position:absolute;
  width:200%;
  height:300px;
  background:url("https://i.imgur.com/3QKQ9hY.png") repeat-x;
  opacity:0.2;
}

.clouds{
  top:0;
  animation:moveClouds 60s linear infinite;
}

.clouds2{
  top:50px;
  opacity:0.1;
  animation:moveClouds 120s linear infinite reverse;
}

@keyframes moveClouds{
  from{transform:translateX(0);}
  to{transform:translateX(-50%);}
}

/* ===== CENTER ===== */
.container{
  position:relative;
  z-index:5;
  text-align:center;
  top:120px;
}

/* ===== DRAGON ===== */
.dragon{
  width:260px;
  filter:drop-shadow(0 0 25px red);
  animation:float 3s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

/* ===== FIRE BLAST ===== */
.fire{
  position:absolute;
  top:140px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,80,0,0.9), transparent 70%);
  filter:blur(10px);
  opacity:0;
}

/* animasi tembakan api */
.fire.active{
  animation:blast 1s ease-out;
}

@keyframes blast{
  0%{width:0;height:0;opacity:0;}
  30%{width:120px;height:120px;opacity:1;}
  100%{width:300px;height:300px;opacity:0;}
}

/* ===== TEXT ===== */
.title{
  font-size:42px;
  font-weight:bold;
  background:linear-gradient(90deg,gold,orange,red);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.subtitle{
  font-size:18px;
  opacity:0.8;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="clouds"></div>
<div class="clouds2"></div>

<div class="container">

  <!-- DRAGON (SVG inline biar aman & gak error hosting) -->
  <svg class="dragon" viewBox="0 0 512 512">
    <path fill="red" d="M256 30c60 40 80 90 70 140-10 50-60 80-60 120s60 70 90 120c-80-20-120-60-140-110-20 50-60 90-140 110 30-50 90-90 90-130s-50-70-60-120C166 120 196 70 256 30z"/>
  </svg>

  <div class="fire" id="fire"></div>

  <div class="title">MexCloud Store</div>
  <div class="subtitle">Breath The Vibe</div>

</div>

<script>
const fire = document.getElementById("fire");

function blastFire(){
  fire.classList.add("active");

  setTimeout(()=>{
    fire.classList.remove("active");
  }, 1000);
}

// tiap 4 detik nyembur api
setInterval(blastFire, 4000);

// langsung start pertama
blastFire();
</script>

</body>
</html>
