<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;
}

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  z-index: 999;
}
.logo,
.cart {
    flex-shrink: 0;
}

.search-top {
  flex: 1;
  display: flex;
  justify-content: center;
  margin: 0 15px;
}
.cart {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-size: 20px;
}
.search-top input {
  width: 100%;
  max-width: 500px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}
#cart-count {
  background: red;
  color: white;
  padding: 3px 7px;
  border-radius: 50%;
  font-size: 12px;
}
/* BRAND */
.brand {
  text-align: center;
  position: absolute;
  top: 10%;
  width: 100%;
}

.title {
  font-size: 50px;
  font-weight: 800;
}

.subtitle {
  letter-spacing: 5px;
}

/* KATALOG */
.catalog {
  padding: 30px;
}

.category {
  background: black;
  color: white;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.sub {
  display: none;
  padding-left: 15px;
}

.sub div {
  padding: 8px;
  cursor: pointer;
}

/* PRODUCTS */
.products {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card button {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: none;
  background: black;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

/* CART POPUP */
.cart-popup {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 9999;
}

.cart-box {
  background: white;
  width: 90%;
  max-width: 400px;
  margin: 100px auto;
  padding: 20px;
  border-radius: 10px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.cart-item button {
  background: red;
  color: white;
  border: none;
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
}
.card {
  transition: 0.2s ease;
}

.card:hover {
  transform: scale(1.05);
}
 .hero {
  margin-top: 60px;
  height: 50vh;
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom, #6ec6ff, #bfe8ff);
}

/* CLOUD */
.cloud {
    position: absolute;
    left: -200px;
    width: 240px;
    opacity: 0.9;
    z-index: 2;

    animation: moveCloud 20s linear infinite;
}

/* gerak mulus kiri ke kanan */
@keyframes moveCloud {
  from {
    left: -200px;
  }
  to {
    left: 110%;
  }
}
.dragon {
  position: absolute;
  bottom: 90px;
  left: 50%;
  width: 420px;
  transform: translateX(-50%);
  z-index: 3;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateX(-50%) translateY(0px); }
  50% { transform: translateX(-50%) translateY(-15px); }
  100% { transform: translateX(-50%) translateY(0px); }
}
 @media (max-width: 600px) {
  .dragon {
    width: 280px;
  }
  .cloud {
    width: 120px;
  }
}
.c1 { top:40px; animation-duration:18s; }
.c2 { top:100px; animation-duration:22s; }
.c3 { top:160px; animation-duration:26s; }
.c4 { top:220px; animation-duration:20s; }
.c5 { top:280px; animation-duration:24s; }
 .dragon {
  filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2));
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo">MexCloud</div>

  <div class="search-top">
    <input type="text" placeholder="Cari produk...">
  </div>

  <div class="cart" onclick="openCart()">
    🛒 <span id="cart-count">0</span>
  </div>
</div>

<!-- HERO -->
<div class="hero">

<img src="./cloud.png" class="cloud c1">
<img src="cloud.png" class="cloud c2">
<img src="cloud.png" class="cloud c3">
<img src="cloud.png" class="cloud c4">
<img src="cloud.png" class="cloud c5">
 <img src="./dragon.png" class="dragon">

  <div class="brand">
    <h1 class="title">MexCloud Store</h1>
    <h2 class="subtitle">BREATH THE VIBES</h2>
  </div>

</div>

<!-- KATALOG -->
<div class="catalog">

  <div class="category" onclick="toggle('obat')">OBAT INDONESIA</div>
  <div class="sub" id="obat">
    <div onclick="showProducts('obat-umum')">Obat Umum</div>
    <div onclick="showProducts('obat-18')">Obat 18+</div>
  </div>

  <div class="category" onclick="showProducts('rokok')">ROKOK INDONESIA</div>

</div>

<!-- PRODUCTS -->
<div class="products" id="products"></div>

<!-- CART POPUP -->
<div id="cart-popup" class="cart-popup">
  <div class="cart-box">
    <h3>🛒 Keranjang</h3>
    <div id="cart-items"></div>

    <br>
    <button onclick="checkoutTelegram()">Checkout Telegram</button>
    <button onclick="closeCart()">Tutup</button>
  </div>
</div>

<script>
let cart = [];

function addToCart(item) {
  cart.push(item);
  document.getElementById("cart-count").innerText = cart.length;
  renderCart();

  document.getElementById("cart-popup").style.display = "block";
}

function toggle(id) {
  let el = document.getElementById(id);
  el.style.display = el.style.display === "block" ? "none" : "block";
}

function showProducts(type) {
  const data = {
    "obat-umum": ["Paracetamol", "Bodrex"],
    "obat-18": ["Obat Kuat A", "Obat Kuat B"],
    "rokok": ["Gudang Garam", "Marlboro"]
  };

  let container = document.getElementById("products");
  container.innerHTML = "";

  (data[type] || []).forEach(item => {
    container.innerHTML += `
      <div class="card">
        <h3>${item}</h3>
        <button onclick="addToCart('${item}')">Beli</button>
      </div>
    `;
  });
}

/* CART */
function closeCart() {
  document.getElementById("cart-popup").style.display = "none";
}
function renderCart() {
  let container = document.getElementById("cart-items");
  container.innerHTML = "";

  if (cart.length === 0) {
    container.innerHTML = "<p>Cart masih kosong</p>";
    return;
  }

  cart.forEach((item, i) => {
    container.innerHTML += `
      <div class="cart-item">
        <span>${item}</span>
        <button onclick="removeItem(${i})">Hapus</button>
      </div>
    `;
  });
}
function removeItem(i) {
  cart.splice(i, 1);
  document.getElementById("cart-count").innerText = cart.length;
  renderCart();
}
 

/* CHECKOUT TELEGRAM */
function checkoutTelegram() {
  if (cart.length === 0) return alert("Cart kosong!");

  let msg = "Pesanan MexCloud:%0A";
  cart.forEach((item, i) => {
    msg += `${i+1}. ${item}%0A`;
  });

  let bot = "MexCloudStore";
window.open(`https://t.me/${bot}?text=${msg}`, "_blank");
}
function openCart() {
  document.getElementById("cart-popup").style.display = "block";
  renderCart();
}
</script>

</body>
</html>
