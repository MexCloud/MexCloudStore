<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MexCloud Store</title>

<style>
  * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: Arial, sans-serif;

  background:
    linear-gradient(
      rgba(180,220,255,0.85),
      rgba(220,240,255,0.95)
    ),
    url('./sky.jpg');

  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}

/* TOPBAR */
.topbar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 60px;
  background: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 15px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  z-index: 999;
}
.logo,
.cart {
    flex-shrink: 0;
}

.search-top {
  flex: 1;
  display: flex;
  justify-content: center;
  margin: 0 15px;
}
.cart {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  font-size: 20px;
}
.search-top input {
  width: 100%;
  max-width: 500px;
  padding: 10px;
  border-radius: 10px;
  border: none;
  background: #f1f1f1;
}
#cart-count {
  background: red;
  color: white;
  padding: 3px 7px;
  border-radius: 50%;
  font-size: 12px;
}
/* BRAND */
.title {
  font-size: 50px;
  font-weight: 800;
}

.subtitle {
  letter-spacing: 5px;
}

/* KATALOG */
.category {
  background: black;
  color: white;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  cursor: pointer;
}

.sub {
  display: none;
  padding-left: 15px;
}

.sub div {
  padding: 8px;
  cursor: pointer;
}

/* PRODUCTS */
.products {
  padding: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
}

.card {
  background: white;
  padding: 15px;
  border-radius: 10px;
  text-align: center;

  display: flex;
  flex-direction: column;
}

.card button {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  border: none;
  background: black;
  color: white;
  border-radius: 6px;
  cursor: pointer;
}

.cart-popup {
  display: block;
  position: fixed;
  top: 0;
  right: -400px;
  width: 380px;
  height: 100vh;
  background: white;
  z-index: 9999;
  transition: 0.35s ease;
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
}

.cart-popup.active {
  right: 0;
}

.cart-box {
  padding: 25px;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.cart-item button {
  background: red;
  color: white;
  border: none;
  padding: 5px 8px;
  border-radius: 5px;
  cursor: pointer;
}
.card {
  transition: 0.2s ease;
}

.card:hover {
  transform: scale(1.05);
}
.hero {
  margin-top: 60px;
  height: 60vh;
  min-height: 420px;
  position: relative;
  overflow: hidden;
  background: linear-gradient(to bottom, #6ec6ff, #bfe8ff);
}

/* CLOUD */
.cloud {
    position: absolute;
    left: -200px;
    width: 240px;
    opacity: 0.9;
    z-index: 2;

    animation: moveCloud 20s linear infinite;
}

/* gerak mulus kiri ke kanan */
@keyframes moveCloud {
  from {
    left: -200px;
  }
  to {
    left: 110%;
  }
}
.dragon {
  position: absolute;
  bottom: 70px;
  left: 50%;
  width: 420px;
  max-width: 80%;
  height: auto;
  transform: translateX(-50%);
  z-index: 3;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  0% { transform: translateX(-50%) translateY(0px); }
  50% { transform: translateX(-50%) translateY(-15px); }
  100% { transform: translateX(-50%) translateY(0px); }
}
 @media (max-width: 600px) {
  .dragon {
    width: 280px;
  }
  .cloud {
    width: 120px;
  }
}
.c1 { top:50px; animation-duration:18s; }
.c2 { top:140px; animation-duration:22s; }
.c3 { top:230px; animation-duration:26s; }
.c4 { top:320px; animation-duration:20s; }
.c5 { top:410px; animation-duration:24s; }
 .dragon {
  filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.2));
}
 .cloud {
  pointer-events: none;
}
 /* LAYER PETIR */
.lightning {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  z-index: 5;
}

/* ANIMASI PETIR */
 .lightning {
  background: radial-gradient(circle, white 0%, #aeefff 40%, transparent 70%);
}
 /* GARIS PETIR */
.lightning-bolt {
  position: absolute;
  top: 0;
  left: 50%;
  width: 100px;
  height: 80%;
  background: white;
  opacity: 0;
  z-index: 6;
  transform: translateX(-50%);
  clip-path: polygon(
    55% 0%,
    35% 35%,
    55% 35%,
    20% 70%,
    45% 70%,
    10% 100%,
    70% 55%,
    45% 55%,
    75% 20%
  );
  filter: drop-shadow(0 0 15px white);
}
/* ANIMASI PETIR TURUN */
@keyframes strike {
  0% {
    opacity: 0;
    transform: translateX(-50%) scaleY(0);
  }

  20% {
    opacity: 1;
    transform: translateX(-50%) scaleY(1);
  }

  40% {
    opacity: 0;
  }

  100% {
    opacity: 0;
  }
}
 .brand {
  text-align:center;
  position:absolute;
  top:10%;
  width:100%;
  z-index:7;
}
.catalog {
  padding: 50px 30px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
}


.catalog-title {
  text-align: center;

  letter-spacing: 2px;
  margin-bottom: 35px;
  color: #111;
  font-family: Arial, sans-serif;
}

/* PRODUCT CATEGORY PREMIUM */

.catalog-grid {

  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:25px;
  max-width:900px;
  margin:auto;

}


.category-card {

}


.category-card:hover {

function addToCart(id) {
  const item = products.find(p => p.id === id);

  if(item){
    cart.push(item);
    document.getElementById("cart-count").innerText = cart.length;
    renderCart();
    openCart();
  }
}


function showCategoryProducts(category){

  const container = document.getElementById("product-list");
  container.innerHTML = "";

  let filtered;

  if(category === "rokok"){
    filtered = products.filter(product =>
      product.category.includes("rokok")
    );
  } else {
    filtered = products.filter(product =>
      product.category === category
    );
  }


  filtered.forEach(product => {

    container.innerHTML += `

    <div class="card">

      <img 
      src="${product.image}" 
      class="product-image"
      onclick="openImage('${product.image}')">

      <h3>${product.name}</h3>

      <div class="price">
      $${product.price} USD
      </div>

      <div class="desc">
      ${product.desc}
      </div>

      <button onclick="addToCart(${product.id})">
      Add to Cart
      </button>

    </div>

    `;

  });


  const yOffset = -70;
  const element = document.getElementById("product-list");

  const y = element.getBoundingClientRect().top 
  + window.pageYOffset 
  + yOffset;


  window.scrollTo({
    top:y,
    behavior:"smooth"
  });

}

 `;


 });


}

 cart.splice(index,1);

 document
 .getElementById("cart-count")

function checkoutTelegram(){

 alert("Cart kosong!");

 return;

 }


 let msg="Pesanan MexCloud:%0A";


 cart.forEach((item,index)=>{

 `${index+1}. ${item.name} $${item.price}%0A`;

 });

 window.open(
 `https://t.me/${bot}?text=${msg}`,

 );


}

function toggleCategory(id){


 let all=document.querySelectorAll(".subcategory");


 all.forEach(item=>{

 item.style.display="none";

 });

 if(selected){

 selected.style.display="block";

 showCategoryProducts("device");

 }


}

// =================


function openImage(image){

 document
 .getElementById("popup-img")
 .src=image;


 document
 .getElementById("img-popup")
 .style.display="flex";

}



function closeImage(){

 document
 .getElementById("img-popup")
 .style.display="none";

}



document
.getElementById("img-popup")
.addEventListener("click",function(e){


 if(e.target===this){

 closeImage();

 }


});



document.addEventListener("keydown",function(e){

 if(e.key==="Escape"){

 closeImage();

 }

});



// =================
// LIGHTNING
// =================


function lightningStrike(){

 const flash=document.querySelector('.lightning');
 const bolt=document.querySelector('.lightning-bolt');


 if(!flash || !bolt)return;



 flash.style.opacity="0.35";


 setTimeout(()=>{

 flash.style.opacity="0";

 },150);



 bolt.style.left =
 Math.random()*80+10+"%";


 bolt.style.animation="none";


 void bolt.offsetWidth;


 bolt.style.animation=
 "strike 0.5s ease-out";



 setTimeout(
 lightningStrike,
 Math.random()*6000+2000
 );


}



lightningStrike();
